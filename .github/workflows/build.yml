name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for z in *.zip; do unzip -qo "$z"; done
      - run: if [ -f fix/Controller.java ]; then cp fix/Controller.java adaptivefps/src/main/java/com/example/adaptivefps/Controller.java; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
      - run: gradle build
        working-directory: adaptivefps
      - uses: actions/upload-artifact@v4
        with:
          name: adaptivefps-jar
          path: adaptivefps/build/libs/*.jar
