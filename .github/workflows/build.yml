name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for z in *.zip; do unzip -qo "$z"; done
      - name: Patch code
        run: |
          python3 - <<'EOF'
          p='adaptivefps/src/main/java/com/example/adaptivefps/Controller.java'
          s=open(p,encoding='utf-8').read()
          s=s.replace("import net.minecraft.client.option.ParticlesMode;","import net.minecraft.client.option.SimpleOption;")
          s=s.replace("private ParticlesMode baseParticles;","private Object baseParticles;")
          s=s.replace("o.getParticles().setValue(ParticlesMode.values()[Math.max(baseParticles.ordinal(), p[2])]);","Enum<?> bp = (Enum<?>) baseParticles; Object[] modes = bp.getDeclaringClass().getEnumConstants(); setRaw(o.getParticles(), modes[Math.min(Math.max(bp.ordinal(), p[2]), modes.length - 1)]);")
          s=s.replace("o.getParticles().setValue(baseParticles);","setRaw(o.getParticles(), baseParticles);")
          i=s.rstrip().rfind("}")
          s=s[:i]+"    @SuppressWarnings({\"unchecked\",\"rawtypes\"})\n    private static void setRaw(SimpleOption opt, Object value) { opt.setValue(value); }\n}\n"
          open(p,'w',encoding='utf-8').write(s)
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
      - run: gradle build
        working-directory: adaptivefps
      - uses: actions/upload-artifact@v4
        with:
          name: adaptivefps-jar
          path: adaptivefps/build/libs/*.jar
